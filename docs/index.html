<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not Today, Babe</title>
<meta name="description" content="Track what you didn't buy and watch a bouquet grow toward something you really want.">
<meta name="theme-color" content="#F3E9DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Not Today, Babe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --beige:#F3E9DA; --card:#FBF6EE; --line:#E6D9C5;
  --ink:#4B3A30; --soft:#9A8776; --olive:#6F7A55; --olive-d:#58623F; --mauve:#C98F98;
  --peach:#F9DCCB; --rose:#F6D5D8; --butter:#F8E8C6; --lilac:#E8DDF0; --sage:#E0E5CE;
  --serif:'Cormorant Garamond','Georgia','Times New Roman',serif;
  --ease:cubic-bezier(.45,0,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--beige);color-scheme:light}
/* 1px taller than the screen so the page always has a little scroll, which is what lets it rubber-band */
body{min-height:calc(100vh + 1px);min-height:calc(100dvh + 1px);font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink);background:var(--beige)}
button{font-family:inherit;font-weight:700;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,.slider:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
input{font-family:inherit}

.screen{height:100vh;height:100dvh;overflow:hidden;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding:max(18px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom));animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:0}to{opacity:1}}

h1{font-weight:600;font-size:27px;line-height:1.02;letter-spacing:-.2px;flex:0 0 auto}
h1 span{color:var(--olive);font-size:21px;vertical-align:middle}

/* home scene */
.gwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:flex-start}
#scene{position:relative;flex:0 0 auto;margin-left:-14px}
#scene>svg{width:100%;height:100%;overflow:visible;display:block}
/* the progress ruler on the right: $ ticks up the side, a pill that rises with your savings */
.ruler{position:absolute;right:0;top:0;height:300px;width:66px;pointer-events:none}
.rline{position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid rgba(88,98,63,.38)}
.rfill{position:absolute;left:-.5px;bottom:0;width:2.5px;background:var(--olive);border-radius:2px}
.rtick{position:absolute;left:0;transform:translateY(-50%);display:flex;align-items:center;gap:5px;font-size:14.5px;color:var(--ink)}
.rtick:before{content:'';width:9px;border-top:1.5px solid rgba(88,98,63,.55)}
.rtick .rl{display:inline-block;transition:transform .6s var(--ease)}
.rpill:before{content:'';position:absolute;right:100%;top:50%;width:6px;border-top:2px solid var(--olive)}
.rpill{position:absolute;left:6px;transform:translateY(50%);background:var(--olive);color:#FBF6EE;border-radius:999px;padding:1px 12px;font-size:17px;font-weight:700;box-shadow:0 2px 8px rgba(88,98,63,.25)}

/* goal card (home) */
.goal{background:var(--card);border-radius:22px;padding:12px 16px 14px;width:100%;text-align:left;flex:0 0 auto;display:block}
.grow{display:flex;align-items:center;gap:12px}
.gicon{width:44px;height:44px;border-radius:50% 46% 54% 48%/48% 54% 46% 52%;background:var(--rose);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.gmain{flex:1;min-width:0}
.gname{font-size:20px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{font-size:15px;color:var(--soft)}
.gpct{font-size:22px;font-weight:700;color:var(--olive)}
.track{height:6px;background:var(--line);border-radius:999px;margin-top:10px;overflow:hidden}
.fill{height:100%;background:var(--olive);border-radius:999px}
.claim{background:var(--mauve);color:#fff;border-radius:999px;padding:8px 16px;font-size:17px}

/* tiles */
.bar{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;flex:0 0 auto;margin-top:2px}
.bar i{color:var(--soft)}
.bar button{color:var(--ink);font-size:17px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex:0 0 auto}
.todaylink{flex:0 0 auto;background:var(--card);border-radius:999px;padding:6px 13px;font-size:15px;color:var(--ink);white-space:nowrap;margin-top:4px}
.pick{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.q{display:flex;justify-content:space-between;align-items:baseline;font-style:italic;color:var(--soft);font-size:17px;padding:0 4px}
.editlink{font-style:normal;font-size:15px;color:var(--olive);text-decoration:underline;font-weight:700}
.dock{display:flex;gap:12px;align-items:stretch;flex:0 0 auto}
.goalchip{flex:0 0 31%;min-width:0;background:var(--card);border-radius:22px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;cursor:pointer}
.goalchip .gname{max-width:100%;font-size:18px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.1}
.goalchip .gsub{font-size:14px}
.goalchip .glink{font-size:14px;color:var(--olive);text-decoration:underline;font-weight:700}
.goalchip .claim{margin-top:4px;padding:5px 14px;font-size:16px}
.tiles{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px}
.blob{width:54px;height:54px;display:grid;place-items:center;font-size:25px;transition:transform .2s var(--ease)}
.tile:active .blob{transform:scale(.94)}
.tile:nth-child(8n+1) .blob,.b1{background:var(--peach);border-radius:52% 48% 56% 44%/50% 56% 44% 50%}
.tile:nth-child(8n+2) .blob,.b2{background:var(--lilac);border-radius:46% 54% 48% 52%/54% 46% 54% 46%}
.tile:nth-child(8n+3) .blob,.b3{background:var(--rose);border-radius:54% 46% 52% 48%/46% 54% 46% 54%}
.tile:nth-child(8n+4) .blob,.b4{background:var(--butter);border-radius:48% 52% 46% 54%/52% 48% 54% 46%}
.tile:nth-child(8n+5) .blob,.b5{background:var(--sage);border-radius:50% 50% 54% 46%/46% 52% 48% 54%}
.tile:nth-child(8n+6) .blob,.b6{background:var(--peach);border-radius:46% 54% 50% 50%/52% 46% 54% 48%}
.tile:nth-child(8n+7) .blob,.b7{background:var(--rose);border-radius:54% 46% 48% 52%/48% 54% 46% 52%}
.tile.other .blob,.b8{background:transparent;border:2px dashed var(--line);border-radius:50%;color:var(--soft);font-size:26px}

/* add screen: slider on the left, a quiet flower on the right, lots of air around both */
.top{display:flex;align-items:flex-start;justify-content:space-between;flex:0 0 auto}
.icon{font-size:30px;line-height:1;width:40px;height:40px;color:var(--ink)}
.cat{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cat .blob{width:60px;height:60px;font-size:28px}
.ctitle{font-size:28px;font-weight:600;line-height:1.1}
.ctitle input{border:none;border-bottom:2px solid var(--line);background:transparent;text-align:center;font-size:26px;font-weight:600;color:var(--ink);width:190px;padding:0 0 2px;font-family:inherit}
.tag{font-size:16px;font-style:italic;color:var(--soft);font-weight:500}
.abody{flex:1;min-height:0;display:flex;gap:4px;padding-left:10px}
.slider{position:relative;flex:0 0 150px;margin:30px 0;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.strack{position:absolute;left:8px;top:0;bottom:0;width:34px;border-radius:999px;
  background:linear-gradient(0deg,#F8D9C2 0%,#F6CFCF 45%,#EADFF2 100%)}
.tick{position:absolute;left:64px;transform:translateY(-50%);font-size:16px;color:var(--ink)}
.thumb{position:absolute;left:0;width:50px;height:50px;margin-top:-25px;border-radius:50%;background:#FFFBF5;box-shadow:0 3px 12px rgba(120,80,50,.2);display:grid;place-items:center}
.thumb svg{width:34px;height:34px;overflow:visible}
.bubble{position:absolute;left:62px;margin-top:-18px;background:var(--mauve);color:#fff;border-radius:999px;padding:4px 16px;font-size:20px;font-weight:700;cursor:text;box-shadow:0 2px 8px rgba(150,90,100,.22)}
.vase{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-end}
#pv{width:76%;height:100%;display:flex;justify-content:center}
#pv svg{height:100%;width:100%;overflow:visible}
.note{background:var(--card);border-radius:20px;padding:10px 16px 8px;flex:0 0 auto}
.nh{display:flex;justify-content:space-between;font-size:15px;color:var(--soft)}
.note input{width:100%;border:none;background:transparent;font-size:19px;color:var(--ink);padding:4px 0 2px;font-weight:600}
.note input::placeholder{color:#c2b19b}
.btn{background:var(--olive);color:#FBF6EE;border-radius:999px;padding:15px 22px;font-size:21px;width:100%;flex:0 0 auto;transition:transform .1s var(--ease)}
.btn.small{width:auto;padding:11px 24px;font-size:18px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.press{transform:scale(.98)}

/* goal + log screens */
.gform{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.gform input{border:none;border-radius:999px;padding:14px 20px;font-size:20px;background:var(--card);color:var(--ink);width:100%;font-weight:600}
.gform input::placeholder{color:#b8a690}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{font-size:24px;width:46px;height:46px;border-radius:50%;background:var(--card);border:2px solid transparent}
.emojis button.on{border-color:var(--olive)}
.textlink{color:var(--soft);font-size:15px;text-decoration:underline;font-weight:600;margin:auto auto 0}
.links{margin-top:auto;display:flex;gap:22px;justify-content:center}
.links .textlink{margin:0}
.head2{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.head2 h1{font-size:32px}
.log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:18px}
.item .l{flex:1;min-width:0}
.item .l small{display:block;font-size:14px;color:var(--soft);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{color:var(--soft)}
.item .x{color:var(--soft);font-size:14px;width:28px;height:28px}
.empty{color:var(--soft);font-style:italic;text-align:center;margin-top:40px;font-weight:500;font-size:19px}

#toast{visibility:hidden;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140px);background:var(--olive-d);color:#FBF6EE;padding:10px 22px;border-radius:999px;font-size:17px;font-weight:700;transition:transform .5s var(--ease);z-index:50;max-width:92vw;text-align:center;white-space:nowrap;padding:9px 18px}
#toast.show{visibility:visible;transform:translate(-50%,0)}
@media (max-height:640px){h1{font-size:23px}.blob{width:46px;height:46px;font-size:21px}.tile{font-size:13px}.cat .blob{width:48px;height:48px}.ctitle{font-size:24px}.tag{display:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.btn,.blob,#toast{transition:none}}

/* customise buttons */
.clist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.crow{display:flex;align-items:center;gap:12px}
.cemoji{flex:0 0 auto;width:54px;height:54px;font-size:25px}
.cname{flex:1;min-width:0;border:none;border-radius:999px;padding:12px 18px;font:inherit;font-size:19px;background:var(--card);color:var(--ink)}
.cprice{flex:0 0 92px;display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:0 14px;font-size:19px;color:var(--soft)}
.cprice input{width:100%;border:none;background:transparent;font:inherit;font-size:19px;color:var(--ink);padding:12px 0;min-width:0}
.cpick{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border-radius:20px;padding:10px}
.cpick button{font-size:24px;width:42px;height:42px;border-radius:50%}

/* hold feedback: a soft ring that grows while you press */
.tile.holding .blob{animation:hold .42s var(--ease) forwards}
@keyframes hold{from{box-shadow:0 0 0 0 rgba(111,122,85,.0)}to{box-shadow:0 0 0 7px rgba(111,122,85,.22)}}
.tundo{margin-left:14px;color:#FBF6EE;text-decoration:underline;font-size:16px;font-weight:700}
@media (prefers-reduced-motion:reduce){.tile.holding .blob{animation:none}}

/* icon picker for "Other" */
.screen{position:relative}
.cat .blob.pickable{cursor:pointer;position:relative}
.pickable::after{content:'✎';position:absolute;right:-3px;bottom:-3px;width:21px;height:21px;display:grid;place-items:center;font-size:12px;background:var(--card);border:1.5px solid var(--line);border-radius:50%;color:var(--ink)}
.cpickpanel{position:absolute;left:20px;right:20px;top:128px;z-index:30;background:var(--card);border-radius:22px;padding:12px;box-shadow:0 10px 30px rgba(120,80,50,.18)}
.cpickpanel[hidden]{display:none}
.cpick2{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-height:42vh;overflow-y:auto}
.cpick2 button{font-size:25px;height:42px;border-radius:14px}
.cpick2 button:active{background:var(--beige)}

.bubin{width:78px;background:transparent;border:none;color:#fff;font:inherit;font-size:20px;font-weight:700;text-align:center;outline:none;padding:0;-moz-appearance:textfield}
.bubin::-webkit-outer-spin-button,.bubin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tick small{font-size:13px;color:var(--soft);font-weight:500;font-style:italic}

.fresh{display:flex;gap:10px;align-items:flex-start;font-size:17px;color:var(--ink);padding:2px 6px}
.fresh input{width:22px;height:22px;margin-top:3px;accent-color:#6F7A55;flex:0 0 auto}
.fresh small{display:block;color:var(--soft);font-size:14px;font-weight:500}

/* history */
.weekhead{display:flex;gap:8px;align-items:baseline;font-size:17px;color:var(--soft);flex:0 0 auto;margin-top:-2px}
.weekhead b{font-size:24px;color:var(--ink)}
.week{display:flex;align-items:flex-end;gap:8px;height:96px;background:var(--card);border-radius:22px;padding:12px 14px 8px;flex:0 0 auto}
.wcol{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.wcol span{font-size:14px;color:var(--soft)}
.wcol .wbar{width:100%;max-width:26px;border-radius:10px;background:var(--peach);min-height:4px;transition:height .6s var(--ease)}
.wcol.t .wbar{background:var(--mauve)}
.wcol.t span{color:var(--ink);font-weight:700}
.wcol{position:relative}
.wcol .wbar{flex:0 0 auto}
.dayhead{display:flex;justify-content:space-between;font-size:16px;font-style:italic;color:var(--soft);padding:14px 2px 2px}

.sampbox{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:12px 14px;flex:0 0 auto}
.sampbox .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sampbox b{font-size:18px}
.sampbox span{font-size:15px;color:var(--soft);line-height:1.15}
.sampbox em{font-size:15px;color:var(--olive);font-style:normal;font-weight:700;margin-top:2px}
.sampbox .btn{flex:0 0 auto;min-height:46px;touch-action:manipulation;white-space:nowrap}
.ex{font-style:normal;font-size:12px;color:var(--soft);background:var(--beige);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:2px;font-weight:600}

/* past saves */
.addpast{flex:0 0 auto;background:var(--olive);color:#FBF6EE;border-radius:999px;padding:12px 18px;font-size:19px;min-height:46px;touch-action:manipulation}
.pastgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;margin-top:18px}
.when{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:nowrap}
.when .wl{font-size:16px;color:var(--soft);margin-right:0;flex:0 0 auto}
.when button,.wpick{background:var(--card);border-radius:999px;padding:6px 11px;font-size:16px;white-space:nowrap;flex:0 0 auto;border:2px solid transparent;position:relative;cursor:pointer}
.when button.on,.wpick.on{border-color:var(--olive)}
.wpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.whenhint{font-size:14px;font-style:italic;color:var(--soft);margin-top:-4px}
.whenhint:empty{display:none}

.when .wpick{flex:1;min-width:0;text-align:center;font-size:17px}

/* the bars live inside their own track, so the day letters can never push them out of the card */
.wcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-height:0}
.wtrack{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wcol .wbar{width:100%;max-width:26px;flex:0 0 auto}

/* claimed */
.tabs{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;flex:0 0 auto}
.tabs button{flex:1;padding:8px 10px;border-radius:999px;font-size:18px;color:var(--soft)}
.tabs button.on{background:var(--olive);color:#FBF6EE}
.claimsum{font-size:17px;color:var(--soft);padding:2px 4px 10px}
.claimsum b{color:var(--ink)}
.cl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;margin-bottom:10px}
.cl .cltext{flex:1;min-width:0}
.cl .gname{font-size:19px;font-weight:700;line-height:1.1}
.cl .gsub{font-size:15px;color:var(--soft)}
.cl .glink{font-size:14px;color:var(--olive);text-decoration:underline;font-weight:700}

/* tap a bar to read it */
.week{height:132px;padding:44px 14px 8px}
button.wcol{background:none;padding:0;font:inherit;color:inherit;cursor:pointer;position:relative;touch-action:manipulation}
.wcol .wlabel{font-size:14px;color:var(--soft)}
.wcol.t .wlabel{color:var(--ink);font-weight:700}
.wcol.sel .wbar{background:#EBAF98}
.wcol.t.sel .wbar{background:var(--mauve)}
.wtip{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:#FFFDF9;color:var(--ink);border:1.5px solid #F1D4C6;border-radius:14px;padding:2px 10px;white-space:nowrap;font-size:17px;z-index:2;box-shadow:0 4px 12px rgba(150,100,70,.14)}
.wtip b{color:var(--ink)}
.wtip small{font-size:13px;color:var(--soft);font-weight:500}
.wtip[hidden]{display:none}
.wcol.first .wtip{left:-6px;transform:none}
.wcol.last .wtip{left:auto;right:-6px;transform:none}
.whint{margin-left:auto;font-size:14px;color:var(--soft);font-weight:500}

/* home button on the tracker */
.hbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.hbtns .todaylink{margin-top:4px}
.homebtn{width:38px;height:38px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;touch-action:manipulation}

/* Home Screen: a big vase of flowers running off the right edge */
.welcome{position:relative}
.whero{position:absolute;right:-36%;bottom:118px;width:122%;aspect-ratio:340/406;pointer-events:none;z-index:0}
.whero svg{width:100%;height:100%;overflow:visible;display:block}
.wtext,.wbtns{position:relative;z-index:1}
.wbrand{font-size:19px;font-style:italic;color:var(--olive);font-weight:600;margin-bottom:6px}
.welcome h1{font-size:40px;line-height:1.02}
.wstats{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
.wstats div{display:flex;flex-direction:column}
.wstats b{font-size:26px;line-height:1}
.wstats span{font-size:15px;color:var(--soft);max-width:110px;line-height:1.1;margin-top:2px}
.wbtns{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.wrow{display:flex;gap:8px}
.wrow button{flex:1;background:rgba(251,246,238,.9);border-radius:999px;padding:11px 8px;font-size:18px;touch-action:manipulation;box-shadow:0 2px 10px rgba(150,100,70,.1)}

/* goal entry lives on the Home Screen */
.wform{position:relative;z-index:1;margin-top:auto;background:rgba(251,246,238,.95);border-radius:26px;padding:14px 16px 12px;box-shadow:0 8px 28px rgba(150,100,70,.14);max-height:66%;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.wfhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wftitle{font-size:24px;font-weight:700;line-height:1.1}
.wform .tag{font-size:15px;margin-top:2px}
.wform .gform{margin-top:2px;gap:10px}
.wform .gform input[type=text],.wform .gform input[type=number],.wform .gform input[type=url],.wform .gform input:not([type]){background:#FFFDF9;border:1.5px solid var(--line);padding:12px 18px;font-size:19px}
.wform .emojis button{background:#FFFDF9}
.wform .emojis button.on{border-color:var(--olive)}
.wform .links{margin-top:0}

.homebtn{font-size:20px}

/* the tracker without a goal */
.goalchip.empty{background:rgba(251,246,238,.5);border:2px dashed rgba(111,122,85,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--olive)}
.goalchip.empty .gplus{font-size:36px;line-height:1;color:var(--olive);font-weight:500}
.goalchip.empty .gname{font-size:19px;color:var(--olive);text-align:center}
.wtop .todaylink{position:relative;z-index:1}

/* the way back to the tracker should be easy to spot */
#totracker{background:var(--olive);color:#FBF6EE;font-size:18px;font-weight:700;padding:10px 18px;min-height:44px;margin-top:2px;box-shadow:0 4px 14px rgba(88,98,63,.35);touch-action:manipulation}
#totracker:active{transform:scale(.97)}

/* keep the title on two lines: the button floats in the top-right corner */
.wtop{display:block;position:relative}
.wtop #totracker{position:absolute;top:0;right:0;margin:0;z-index:2}

/* the goal card: high on the screen, comfortable type, and small enough that the vase shows beneath it */
.wform{max-height:none;overflow:visible;margin-top:16px;padding:14px 16px 12px;gap:8px;background:rgba(251,246,238,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.wform .wftitle{font-size:25px}
.wform .tag{font-size:15px;margin-top:1px}
.wform .gform{gap:9px;margin-top:2px}
.wform .gform input:not([type=checkbox]){padding:11px 18px;font-size:18px}
.wform .emojis{flex-wrap:nowrap;gap:2px;justify-content:space-between}
.wform .emojis button{flex:1 1 0;min-width:0;max-width:36px;width:auto;height:34px;font-size:19px;padding:0}
.wform .btn{padding:13px 20px;font-size:20px}
.wform .links{gap:20px}
.wform .links .textlink{font-size:14px}
/* shorter phones: tuck everything in so it still fits without scrolling */
@media (max-height:680px){
  .wform{margin-top:12px;padding:12px 14px 10px;gap:6px}
  .wform .wftitle{font-size:22px}
  .wform .tag{font-size:14px;margin-top:0}
  .wform .gform{gap:8px;margin-top:2px}
  .wform .gform input:not([type=checkbox]){padding:10px 16px;font-size:17px}
  .wform .emojis{flex-wrap:nowrap;gap:3px;justify-content:space-between}
  .wform .emojis button{flex:1 1 0;min-width:0;max-width:38px;width:auto;height:34px;font-size:18px}
  .wform .btn{padding:12px 20px;font-size:19px}
  .wform .links .textlink{font-size:14px}
  .welcome .wbrand{display:none}
  .welcome h1{font-size:30px}
}

/* taller phones: let the vase sit lower so flowers and butterflies fill the space under the card */
@media (min-height:681px){.whero{bottom:0}}

/* the goals screen garden: plants behind the card, butterflies and sparkles floating over everything */
.garden,.gfx{position:absolute;left:0;right:0;bottom:0;height:min(42vh,340px);pointer-events:none}
.garden{z-index:2}
.gfx{z-index:3}
.garden svg,.gfx svg{display:block;width:100%;height:100%;overflow:visible}
@media (min-height:681px){.whero{bottom:0}}

/* goal icon: one + button that opens a picker */
.iconrow{display:flex;align-items:center;gap:12px}
.iconpick{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:#FFFDF9;border:2px dashed #D7C7AE;font-size:30px;line-height:1;color:var(--soft);display:grid;place-items:center;touch-action:manipulation}
.iconpick.set{border:2px solid var(--line);color:inherit;font-size:28px}
.iconhint{font-size:17px;color:var(--soft);font-style:italic}
.gpanel{position:absolute;left:10px;right:10px;top:56px;z-index:6;background:#FFFDF9;border-radius:22px;padding:12px;box-shadow:0 12px 32px rgba(120,80,50,.22)}
.gpanel[hidden]{display:none}
.gpgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:208px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:2px 2px 6px}
.gpgrid button{font-size:34px;height:56px;border-radius:18px;padding:0}
.gpgrid button:active{background:var(--beige)}

/* the icon picker floats above everything, animations included */
.welcome>.gpanel{position:absolute;left:20px;right:20px;z-index:9}

/* the icon picker is a pop-up with a tail, unrolling out of the icon circle */
.welcome>.gpanel{top:auto;transform-origin:calc(var(--cx,40px) + 8px) 100%;overflow:visible}
.welcome>.gpanel::after{content:'';position:absolute;bottom:-8px;left:var(--cx,40px);width:16px;height:16px;background:#FFFDF9;transform:rotate(45deg);border-radius:0 0 4px 0;box-shadow:4px 4px 8px rgba(120,80,50,.1)}
.gpanel.open{animation:gp-open .46s cubic-bezier(.2,.85,.25,1) both}
.gpanel.closing{animation:gp-close .19s ease-in both}
@keyframes gp-open{0%{opacity:0;transform:scale(.5,.12)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes gp-close{to{opacity:0;transform:scale(.6,.15)}}
@media (prefers-reduced-motion:reduce){.gpanel.open,.gpanel.closing{animation:none}}

/* "Add a goal to get started" */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:rgba(75,58,48,.3);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:m-fade .22s ease both}
.modal.out{animation:m-fade .18s ease reverse both}
.mcard{width:min(340px,100%);background:#FFFBF5;border-radius:28px;padding:26px 22px 18px;text-align:center;box-shadow:0 18px 48px rgba(90,60,40,.28);display:flex;flex-direction:column;align-items:center;gap:10px;animation:m-pop .3s cubic-bezier(.2,.85,.25,1) both}
.mflower{font-size:46px;line-height:1}
.mtitle{font-size:26px;font-weight:700;line-height:1.1}
.mtext{font-size:17px;color:var(--soft);font-weight:500;line-height:1.25;margin-bottom:6px}
.mcard .btn{margin-top:4px}
.mcard .textlink{margin:2px 0 0;font-size:16px}
@keyframes m-fade{from{opacity:0}to{opacity:1}}
@keyframes m-pop{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal,.modal.out,.mcard{animation:none}}

/* Bloomed! — the claim celebration */
.bloomed{position:relative;gap:8px;text-align:center}
.bloomed .bloomx{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;z-index:5}
.bloomhero{flex:1 1 0;min-height:150px;display:flex;justify-content:center;align-items:flex-end;position:relative;margin-top:-4px}
.bloomed h1{font-size:44px;line-height:1.02;text-align:center;text-wrap:balance;margin-top:2px}
.bsub{font-size:21px;font-style:italic;color:var(--soft);line-height:1.2;font-weight:500}
.bcard{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:26px;padding:14px 18px;margin-top:4px;text-align:left}
.bicon{flex:0 0 auto;width:72px;height:72px;border-radius:50%;background:#F8D9D4;display:grid;place-items:center;font-size:38px}
.bsaved{font-size:30px;font-weight:700;color:var(--olive-d);line-height:1.05}
.bline{font-size:17px;color:var(--soft);font-weight:500;line-height:1.2;margin-top:2px}
.bsp{color:#F2C879;font-size:18px;margin:0 8px}
.btn.outline{background:transparent;color:var(--olive-d);border:2px solid var(--olive);margin-top:0}
@media (max-height:720px){.bloomed h1{font-size:34px}.bsub{font-size:18px}.bicon{width:56px;height:56px;font-size:30px}.bsaved{font-size:24px}.bline{font-size:15px}.bcard{padding:10px 14px}}

.bubble [hidden]{display:none}
.bubble{min-width:84px;text-align:center}
.bubin{min-width:0;width:74px}

/* the detailed screen: icon, item, date and note live together in one card above the button */
.top .atag{flex:1;text-align:center;align-self:center;padding:0 6px}
.dcard{flex:0 0 auto;background:var(--card);border-radius:24px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px}
.dfield{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dname{border:none;border-bottom:2px solid var(--line);background:transparent;font:inherit;font-size:24px;font-weight:700;color:var(--ink);width:100%;padding:0 0 2px;border-radius:0}
.dname::placeholder{color:#b8a690;font-weight:600}
.dname:focus{outline:none;border-bottom-color:var(--olive)}
.dhint{font-size:15px;color:var(--soft);font-style:italic;font-weight:500}
.dcard .when,.dcard .whenhint{margin:0}
.dcard .note{background:none;border-top:1px solid var(--line);border-radius:0;padding:8px 0 0}
.screen>.apanel{position:absolute;left:20px;right:20px;z-index:9;top:auto;transform-origin:calc(var(--cx,40px) + 8px) 100%;overflow:visible}
.screen>.apanel::after{content:'';position:absolute;bottom:-8px;left:var(--cx,40px);width:16px;height:16px;background:#FFFDF9;transform:rotate(45deg);border-radius:0 0 4px 0;box-shadow:4px 4px 8px rgba(120,80,50,.1)}

/* simpler detailed screen: one row, the note only when asked for */
.dcard{padding:10px 12px;gap:8px}
.drow{gap:10px;align-items:center}
.dicon{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}
.dicon .iconpick{width:50px;height:50px;font-size:26px}
.dchg{font-size:12px;color:var(--soft);font-style:italic;white-space:nowrap}
.dname{flex:1;min-width:0}
.notebtn{flex:0 0 auto;font-size:16px;color:var(--olive-d);background:var(--beige);border-radius:999px;padding:7px 12px;white-space:nowrap;touch-action:manipulation}
.notein{border:none;border-top:1px solid var(--line);background:transparent;font:inherit;font-size:18px;font-weight:600;color:var(--ink);padding:8px 2px 2px;width:100%}
.notein:focus{outline:none}
.notein::placeholder{color:#c2b19b}
.notein[hidden],.notebtn[hidden]{display:none}
#addbtn .bsp{color:#F2C879;font-size:20px;margin:0 8px}

/* icon on the left, title with the note underneath, no lines */
.dcard{padding:12px 14px}
.drow{align-items:center;gap:12px}
.dfield{gap:4px}
.dname{border:none;border-bottom:0;padding:0;font-size:24px;line-height:1.15;background:transparent}
.dname:focus{border-bottom:0}
.dcard .notein{border:none;border-top:0;padding:0;font-size:17px;font-weight:600;color:var(--soft);background:transparent;width:100%}
.dcard .notein::placeholder{color:#c2b19b;font-weight:500}
.dcard .note{display:none}

/* the bouquet on the detailed screen gets the room it needs to look full */
#pv{width:124%;margin-left:-24%;height:100%}
.vase{overflow:visible}

.bloomed .backlink{margin:2px auto 0;font-size:16px}

/* the saved-amount card: the joy of the screen */
.bcard{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFEEDC 0%,#FBD4CE 100%);border:2px solid #F3C2B5;box-shadow:0 12px 28px rgba(214,140,120,.3);padding:14px 18px 14px 14px;gap:14px}
.bcard::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);transform:translateX(-120%);animation:b-shine 1.4s ease 2.6s 1 both;pointer-events:none}
@keyframes b-shine{to{transform:translateX(120%)}}
.bcard .bicon{width:78px;height:78px;background:#FFFDF9;border:3px solid #fff;box-shadow:0 4px 12px rgba(214,140,120,.3);font-size:42px}
.bcard .bsaved{font-size:46px;line-height:1;color:var(--olive-d);letter-spacing:-.5px}
.bcard .bsaved small{font-size:21px;font-weight:600;color:#A06F5F;letter-spacing:0}
.bcard .bline{color:#8E6657;font-size:17px;margin-top:4px}
.bcard.pulse{animation:b-pulse .7s cubic-bezier(.2,.85,.25,1) both}
@keyframes b-pulse{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
.bspk{position:absolute;color:#F2B866;font-size:16px;animation:b-twinkle 2.6s ease-in-out infinite;pointer-events:none}
.bspk.s1{top:8px;right:14px}
.bspk.s2{bottom:10px;right:36px;font-size:12px;animation-delay:.9s}
.bspk.s3{top:12px;left:104px;font-size:11px;animation-delay:1.7s}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@media (max-height:720px){.bcard .bsaved{font-size:36px}.bcard .bicon{width:60px;height:60px;font-size:32px}.bcard .bline{font-size:15px}}
@media (prefers-reduced-motion:reduce){.bcard::after,.bcard.pulse,.bspk{animation:none}}

/* the saved-amount card is a fresh, light green */
.bcard{background:linear-gradient(135deg,#F0F7E4 0%,#D6E8C6 100%);border-color:#BCD6A8;box-shadow:0 12px 28px rgba(111,138,85,.28)}
.bcard .bicon{box-shadow:0 4px 12px rgba(111,138,85,.28)}
.bcard .bsaved small{color:#6F8A55}
.bcard .bline{color:#6B7F58}
.bspk{color:#E9B95A}



/* ready: held long enough, let go to open */
.tile.ready .blob{box-shadow:0 0 0 8px rgba(111,122,85,.32);transform:scale(1.07);transition:transform .15s var(--ease),box-shadow .15s var(--ease)}

</style>

/* =====================================================================
   2. MOTION  — one shared clock, easing, tweens, paths.
   Nothing here knows about flowers. It only knows time.
   ===================================================================== */
const Motion=(()=>{
  const mq=matchMedia('(prefers-reduced-motion: reduce)');
  let forced=null;
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;

  /* cubic-bezier easing, same maths as CSS */
  function bezier(x1,y1,x2,y2){
    const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
    const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t,dx=t=>(3*ax*t+2*bx)*t+cx;
    return x=>{
      if(x<=0)return 0;if(x>=1)return 1;
      let t=x;
      for(let i=0;i<6;i++){const e=sx(t)-x;if(Math.abs(e)<1e-4)break;const d=dx(t);if(Math.abs(d)<1e-6)break;t-=e/d}
      return sy(t);
    };
  }
  const ease={inOut:bezier(.45,0,.25,1),out:bezier(.2,.6,.3,1),soft:bezier(.4,0,.2,1),linear:t=>t};

  /* small seeded random so each organic object keeps its own personality */
  function rng(seed){let a=seed|0||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  /* ---- shared ticker: ONE requestAnimationFrame loop for everything ---- */
  const subs=new Set();let raf=0,last=0,clock=0,inFrame=false;
  function frame(now){
    raf=0;inFrame=true;
    let dt=(now-last)/1000;if(!(dt>0))dt=0;dt=Math.min(.05,dt);last=now;clock+=dt;
    for(const s of [...subs]){
      if(!subs.has(s)||s.paused)continue;
      try{
        if(s.fps){s.acc+=dt;if(s.acc<1/s.fps)continue;const d=s.acc;s.acc=0;s.fn(clock,d)}
        else s.fn(clock,dt);
      }catch(err){subs.delete(s);console.error('animation stopped after an error',err)}   /* one broken animation must never freeze the rest */
    }
    inFrame=false;
    if(subs.size&&!document.hidden)raf=requestAnimationFrame(frame);
  }
  function start(){if(!raf&&!inFrame&&subs.size&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else start()});
  function sub(fn,{fps=0}={}){const s={fn,fps,acc:0,paused:false};subs.add(s);start();return s}
  function unsub(s){if(s)subs.delete(s)}

  /* pause a subscription while an element is off-screen */
  function watch(el,s){
    if(!('IntersectionObserver' in window))return()=>{};
    const io=new IntersectionObserver(es=>{s.paused=!es[es.length-1].isIntersecting});
    io.observe(el);return()=>io.disconnect();
  }

  /* ---- tween: value from -> to, eased, delayed. Reduced motion jumps. ---- */
  function tween({from=0,to=1,duration=1200,delay=0,ease:e=ease.inOut,onUpdate,onDone}){
    let t=-delay/1000,dead=false;
    const api={cancel(){dead=true;unsub(s)},finish(){if(dead)return;dead=true;unsub(s);onUpdate&&onUpdate(to);onDone&&onDone()}};
    if(reduced()){onUpdate&&onUpdate(to);onDone&&onDone();dead=true;const s=null;return{cancel(){},finish(){}}}
    const s=sub((_,dt)=>{
      if(dead)return;t+=dt;if(t<0)return;
      const k=clamp(t/(duration/1000));onUpdate&&onUpdate(lerp(from,to,e(k)));
      if(k>=1){dead=true;unsub(s);onDone&&onDone()}
    });
    return api;
  }
  /* one-shot timer on the same clock */
  function after(ms,fn){let t=0,dead=false;const s=sub((_,dt)=>{if(dead)return;t+=dt*1000;if(t>=ms){dead=true;unsub(s);fn()}});return{cancel(){dead=true;unsub(s)}}}

  /* ---- bezier paths (cubic, multi-segment, arc-length parameterised) ---- */
  const cub=(p0,p1,p2,p3,t)=>{const u=1-t;return{x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}};
  class Path{
    constructor(segs){
      this.pts=[];this.len=[0];
      const N=24;
      segs.forEach((s,si)=>{for(let i=(si?1:0);i<=N;i++)this.pts.push(cub(s[0],s[1],s[2],s[3],i/N))});
      for(let i=1;i<this.pts.length;i++)this.len.push(this.len[i-1]+Math.hypot(this.pts[i].x-this.pts[i-1].x,this.pts[i].y-this.pts[i-1].y));
      this.total=this.len[this.len.length-1];
    }
    at(s){ /* s in 0..1 along the length */
      const L=clamp(s)*this.total;let lo=0,hi=this.len.length-1;
      while(hi-lo>1){const m=(lo+hi)>>1;if(this.len[m]<=L)lo=m;else hi=m}
      const a=this.pts[lo],b=this.pts[Math.min(lo+1,this.pts.length-1)],seg=this.len[Math.min(lo+1,this.len.length-1)]-this.len[lo]||1;
      const f=(L-this.len[lo])/seg;
      return{x:lerp(a.x,b.x,f),y:lerp(a.y,b.y,f),dx:b.x-a.x,dy:b.y-a.y,ang:Math.atan2(b.x-a.x,-(b.y-a.y))*180/Math.PI};
    }
  }
  const reduced=()=>forced!==null?forced:mq.matches;
  return{clamp,lerp,ease,bezier,rng,sub,unsub,watch,tween,after,Path,cub,reduced,
    forceReduced(v){forced=v},get now(){return clock}};
})();

   3. PROGRESS + LAYOUT

  growth(range,p){return Motion.clamp((p-range[0])/(range[1]-range[0]))},

  map(p){
    p=Motion.clamp(p);
    return{
      water:LAYOUT.vase.waterMin+(LAYOUT.vase.waterMax-LAYOUT.vase.waterMin)*p,
      elements:this.recipe.map(e=>({id:e.id,growth:this.growth(e.range,p)})),
      restingPetals:p>=1?3:p>=.95?2:p>=.9?1:0,

  expenseStage(a){
    const k=[[0,0],[5,1.3],[10,2],[20,3],[30,4],[40,4.7],[50,5]];
    a=Motion.clamp(a,0,50);
    for(let i=0;i<k.length-1;i++)if(a<=k[i+1][0])return Motion.lerp(k[i][1],k[i+1][1],(a-k[i][0])/(k[i+1][0]-k[i][0]));
    return 5;
  }
};

/* stem geometry: base in the water -> through the neck -> tip. Pure maths. */
const Geometry={
  curve(slot,fullMeta){
    const s=slot.s,N=LAYOUT.neck,B=LAYOUT.baseY;
    const th=Math.atan2(slot.x-200,340-slot.y)*.8,c=Math.cos(th),sn=Math.sin(th);
    const hxp=(fullMeta.hx-fullMeta.ax)*s,hyp=(fullMeta.hy-fullMeta.ay)*s;
    let Ax=slot.x-(hxp*c-hyp*sn),Ay=slot.y-(hxp*sn+hyp*c);
    if(Ay>300)Ay=300;
    const bx=200+(Ax-200)*.1,Nx=200+(Ax-200)*.12,d2=Math.hypot(Ax-Nx,Ay-N.y);
    const q0={x:bx,y:B},qc={x:Nx,y:362},q1={x:Nx,y:N.y};
    const s1=[q0,{x:q0.x+2/3*(qc.x-q0.x),y:q0.y+2/3*(qc.y-q0.y)},{x:q1.x+2/3*(qc.x-q1.x),y:q1.y+2/3*(qc.y-q1.y)},q1];
    const s2=[q1,{x:Nx,y:N.y-d2*.4},{x:Ax-sn*d2*.4,y:Ay+c*d2*.4},{x:Ax,y:Ay}];
    const f=n=>n.toFixed(1);
    const d=`M${f(s1[0].x)} ${f(s1[0].y)}C${f(s1[1].x)} ${f(s1[1].y)} ${f(s1[2].x)} ${f(s1[2].y)} ${f(s1[3].x)} ${f(s1[3].y)}C${f(s2[1].x)} ${f(s2[1].y)} ${f(s2[2].x)} ${f(s2[2].y)} ${f(s2[3].x)} ${f(s2[3].y)}`;
    const path=new Motion.Path([s1,s2]);
    return{d,at:t=>path.at(t),tip:{x:Ax,y:Ay},rot:th*180/Math.PI,len:path.total};
  }
};

/* =====================================================================
   4. COMPONENTS
   Every component takes: size, x, y, rotation, opacity, animationState,
   animationIntensity, delay, duration  (+ colorVariant / growth / progress /
   direction / speed where they make sense).
   Artwork is only ever referenced by name through ART, so it can be swapped.
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
function svgEl(name,attrs,parent){const e=document.createElementNS(NS,name);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function injectSpriteDefs(){
  if(document.getElementById('sprite-defs'))return;
  let s='<svg id="sprite-defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>';
  for(const k in ART.S){const m=ART.S[k];s+=`<image id="s-${k}" width="${m.w}" height="${m.h}" href="${m.d}"/>`}
  document.body.insertAdjacentHTML('afterbegin',s+'</defs></svg>');
}
/* anchored = origin at the base of the stem, otherwise centred */
function sprite(name,mode='anchor',parent){
  const m=ART.S[name];
  const attrs={href:'#s-'+name};
  if(mode==='anchor'){attrs.x=-m.ax;attrs.y=-m.ay}
  else if(mode==='bottom'){attrs.x=-m.w/2;attrs.y=-m.h}
  else{attrs.x=-m.w/2;attrs.y=-m.h/2}
  return svgEl('use',attrs,parent);
}
const VAR={pink:'pink',cream:'cream',lavender:'lav',butter:'butter'};
const BFCOLOR={pink:'pink',purple:'purple',cream:'cream',blue:'blue'};
let _uid=0;const uid=()=>'u'+(++_uid);
const f1=n=>(Math.round(n*10)/10);

/* ---------- base ---------- */
class Botanical{
  constructor(props={}){
    this.p=Object.assign({size:1,x:0,y:0,rotation:0,opacity:1,animationState:'idle',animationIntensity:1,delay:0,duration:3600},this.constructor.defaults||{},props);
    this.el=svgEl('g');this.body=svgEl('g',null,this.el);
    this.rand=Motion.rng(this.p.seed||((Math.random()*1e9)|0)||7);
    this._subs=[];this._tw=[];
    this.build();this.layout();
  }
  build(){}
  layout(){const p=this.p;this.el.setAttribute('transform',`translate(${f1(p.x)} ${f1(p.y)}) rotate(${p.rotation.toFixed?+p.rotation.toFixed(2):p.rotation}) scale(${p.size})`);this.el.setAttribute('opacity',p.opacity)}
  set(props){Object.assign(this.p,props);this.layout();if(this.changed)this.changed(props);return this}
  mount(parent){parent.appendChild(this.el);return this}
  tween(o){const t=Motion.tween(o);this._tw.push(t);return t}
  fade(ms=220,to=1){const from=+this.el.getAttribute('opacity')||0;this.set({opacity:from});this.tween({from:0,to,duration:ms,ease:Motion.ease.soft,onUpdate:v=>{this.p.opacity=v;this.el.setAttribute('opacity',v)}})}
  destroy(){this._tw.forEach(t=>t.cancel());this._subs.forEach(Motion.unsub);this.el.remove()}
}

/* ---------- Stem ---------- */
class Stem extends Botanical{
  static defaults={curve:null,growth:1,width:1.8,color:'#667349'};
  build(){
    this.path=svgEl('path',{d:this.p.curve?this.p.curve.d:'M0 0L0 -60',fill:'none',stroke:this.p.color,'stroke-width':this.p.width,'stroke-linecap':'round',pathLength:1},this.body);
    this.setGrowth(this.p.growth);
  }
  setGrowth(g){this.p.growth=g;this.path.setAttribute('stroke-dasharray',`${Math.max(0,g)} 2`);this.path.style.opacity=g>0?1:0}
}

/* ---------- Leaf (leaves, foliage, filler sprigs) ---------- */
class Leaf extends Botanical{
  static defaults={sprite:'fill8',growth:1,dir:1};
  build(){
    this.sway=svgEl('g',null,this.body);this.u=sprite(this.p.sprite,'anchor',this.sway);
    this.period=3800+this.rand()*4200;this.phase=this.rand()*6.28;this.g=this.p.growth;this.sw=0;this.apply(this.g);
  }
  apply(g){
    this.g=g;const e=Motion.ease.out(g);
    this._unfold=(1-e)*-9*this.p.dir;this._sc=Motion.lerp(.55,1,e);
    this.sway.setAttribute('opacity',Motion.ease.soft(Motion.clamp(g*1.4)));
    this._paint();
  }
  _paint(){this.sway.setAttribute('transform',`rotate(${(this._unfold+this.sw).toFixed(2)}) scale(${this._sc.toFixed(3)})`)}
  idle(t){if(this.g<=0||Motion.reduced())return;this.sw=Math.sin(t/this.period*6.2832+this.phase)*1.4*this.p.animationIntensity-.2;this._paint()}
}

/* ---------- Flower (head + optional stem, any growth 0..1) ---------- */
const STAGES=[[1.3,'bud1',.85],[2,'bud2',1],[3,'partial',1],[4,'full',.9],[5,'full',1]];
class Flower extends Botanical{
  static defaults={variant:'pink',growth:1,curve:null,slotScale:.55,headScale:1,stemMin:.04,stemWidth:1.8,pivot:{x:200,y:332}};
  build(){
    const p=this.p;
    this.swayG=svgEl('g',null,this.body);
    this.stem=p.curve?new Stem({curve:p.curve,width:p.stemWidth,growth:0}).mount(this.swayG):null;
    this.head=svgEl('g',null,this.swayG);
    this.layerA=svgEl('g',null,this.head);this.useA=svgEl('use',null,this.layerA);
    this.layerB=svgEl('g',null,this.head);this.useB=svgEl('use',null,this.layerB);
    this.period=3200+this.rand()*4600;this.period2=4000+this.rand()*3800;
    this.phase=this.rand()*6.28;this.phase2=this.rand()*6.28;
    this._pos={x:0,y:0,ang:0};this._hr=0;this._nudge=0;this.sw=0;this.hsw=0;this.g=p.growth;
    this.apply(this.g);
  }
  key(name){return `fl_${VAR[this.p.variant]||'pink'}_${name}`}
  apply(g){
    const p=this.p;this.g=g;const stage=g*5;
    const stemT=(g<=0&&p.stemMin<=.05)?0:Motion.lerp(p.stemMin,1,Motion.ease.out(Motion.clamp(stage/1.15)));
    if(this.stem)this.stem.setGrowth(stemT);
    const pos=p.curve?p.curve.at(stemT):{x:0,y:0,ang:0};this._pos=pos;
    let A=null,B=null;
    if(stage>=.7){
      if(stage<1.3){const k=(stage-.7)/.6;A={n:'bud1',sc:Motion.lerp(.7,.85,k),op:Motion.ease.out(k)}}
      else{
        let i=0;while(i<STAGES.length-1&&stage>=STAGES[i+1][0])i++;
        const a=STAGES[i];
        if(i===STAGES.length-1)A={n:a[1],sc:a[2],op:1};
        else{
          const b=STAGES[i+1],e=Motion.ease.inOut((stage-a[0])/(b[0]-a[0]));
          if(a[1]===b[1])A={n:a[1],sc:Motion.lerp(a[2],b[2],e),op:1};
          else{A={n:a[1],sc:a[2],op:1};B={n:b[1],sc:Motion.lerp(b[2]*.9,b[2],e),op:e}}
        }
      }
    }
    /* a slight turn as the bloom opens */
    this._hr=stage>3?Motion.lerp(-3,0,Motion.ease.inOut(Motion.clamp((stage-3)/1.6))):0;
    const S=p.slotScale*p.headScale;
    const put=(layer,use,L)=>{
      if(!L){layer.setAttribute('opacity',0);return}
      if(use.getAttribute('href')!=='#s-'+this.key(L.n)){const nm=this.key(L.n),m=ART.S[nm];use.setAttribute('href','#s-'+nm);use.setAttribute('x',-m.ax);use.setAttribute('y',-m.ay)}
      layer.setAttribute('opacity',L.op.toFixed(3));layer.setAttribute('transform',`scale(${(S*L.sc).toFixed(4)})`);
    };
    put(this.layerA,this.useA,A);put(this.layerB,this.useB,B);
    this._paintHead();
  }
  _paintHead(){const q=this._pos;this.head.setAttribute('transform',`translate(${q.x.toFixed(1)} ${q.y.toFixed(1)}) rotate(${(q.ang+this._hr+this.hsw+this._nudge*.6).toFixed(2)})`)}
  _paintSway(){const c=this.p.pivot;this.swayG.setAttribute('transform',`rotate(${(this.sw+this._nudge).toFixed(3)} ${c.x} ${c.y})`)}
  idle(t){
    if(this.g<=0||Motion.reduced())return;
    const I=this.p.animationIntensity;
    this.sw=Math.sin(t/this.period*6.2832+this.phase)*1.2*I;
    this.hsw=Math.sin(t/this.period2*6.2832+this.phase2)*1.1*I;
    this._paintSway();this._paintHead();
  }
  /* one small, slow movement */
  nudge(amount=2,ms=1500){if(Motion.reduced())return;this.tween({from:0,to:1,duration:ms,ease:Motion.ease.inOut,onUpdate:k=>{this._nudge=Math.sin(k*Math.PI)*amount;this._paintSway();this._paintHead()},onDone:()=>{this._nudge=0}})}
  set(props){if('growth' in props){this.apply(props.growth)}return super.set(props)}
}

/* ---------- Sparkle ---------- */
class Sparkle extends Botanical{
  static defaults={sprite:'spk0',opacity:1};
  build(){this.g=svgEl('g',null,this.body);sprite(this.p.sprite,'center',this.g);this.g.setAttribute('opacity',0)}
  play(){
    if(Motion.reduced())return;
    const dur=this.p.duration&&this.p.duration!==3600?this.p.duration:800+this.rand()*600;
    this.tween({from:0,to:1,duration:dur,delay:this.p.delay,ease:Motion.ease.linear,
      onUpdate:k=>{const s=k<.5?Motion.lerp(.7,1,k*2):Motion.lerp(1,.8,(k-.5)*2);this.g.setAttribute('opacity',(.95*Math.sin(Math.PI*k)).toFixed(3));this.g.setAttribute('transform',`scale(${(s*(this.p.sk||.8)).toFixed(3)})`)},
      onDone:()=>this.g.setAttribute('opacity',0)});
  }
}

/* ---------- Petal (resting / drifting / falling) ---------- */
class Petal extends Botanical{
  static defaults={sprite:'pet0',animationState:'resting'};
  build(){this.g=svgEl('g',null,this.body);sprite(this.p.sprite,'center',this.g);this.g.setAttribute('transform','scale(.34)')}
  drift({from,to,duration=6000,onDone}){
    if(Motion.reduced()){onDone&&onDone();return}
    this.p.animationState='drifting';
    const sway=(this.rand()<.5?-1:1)*(18+this.rand()*20);
    const path=new Motion.Path([[from,{x:from.x+sway,y:from.y+(to.y-from.y)*.28},{x:to.x-sway*1.1,y:from.y+(to.y-from.y)*.62},to]]);
    const r0=this.rand()*60-30,dr=(this.rand()<.5?-1:1)*(110+this.rand()*120);
    this.tween({from:0,to:1,duration,ease:Motion.ease.soft,onUpdate:k=>{
      const q=path.at(k);const op=(k<.6?Motion.lerp(1,.8,k/.6):Motion.lerp(.8,0,(k-.6)/.4))*Math.min(1,k/.07);
      this.p.x=q.x;this.p.y=q.y;this.p.rotation=r0+dr*k;this.p.opacity=op;this.layout();
    },onDone});
  }
}

/* ---------- Butterfly ---------- */
class Butterfly extends Botanical{
  static defaults={variant:"pink",state:"resting",size:.42,speed:1,direction:1,restRotation:0};
  build(){
    const spec=ART.BF[BFCOLOR[this.p.variant]||'pink'],c=BFCOLOR[this.p.variant]||'pink';this.spec=spec;
    this.flight=svgEl('g',null,this.body);                       /* hover / bob */
    this.closed=svgEl('g',null,this.flight);sprite(`bf_${c}_closed`,'center',this.closed);
    this.open=svgEl('g',{opacity:0},this.flight);
    const comp=svgEl('g',{transform:`translate(${-spec.W/2} ${-spec.H/2})`},this.open);
    const wing=(side)=>{const w=spec[side],g=svgEl('g',null,comp);const u=sprite(`bf_${c}_${side}`,'topleft',g);u.setAttribute('x',0);u.setAttribute('y',0);return{g,w}};
    this.L=wing('lw');this.R=wing('rw');
    const b=svgEl('g',{transform:`translate(${spec.body.cx} ${spec.body.cy}) scale(${spec.body.s})`},comp);sprite(`bf_${c}_body`,'center',b);
    const a=svgEl('g',{transform:`translate(${spec.ant.cx} ${spec.ant.by}) scale(${spec.ant.s})`},comp);sprite(`bf_${c}_ant`,'bottom',a);
    this.state='resting';this.openAmt=0;this.angle=8;this._sub=null;this.bobT=this.rand()*10;
    this.rotNow=0;this.q=[];this.cycleT=this.rand()*3;this.restTimer=2+this.rand()*5;this.peek=null;this.periodMod=1;
    this.flutterRange=[8,65];this.period=.26+this.rand()*.16;
    this._setWings(8);this._paintOpen(0);
    this.setState(this.p.state,{instant:true});
  }
  /* wings turn on Y: simulated in SVG with scaleX = cos(angle) about the point where each wing meets the body */
  _setWings(deg){
    const k=Math.cos(deg*Math.PI/180);
    [this.L,this.R].forEach(({g,w})=>g.setAttribute('transform',`translate(${w.x} ${w.y}) scale(${w.s}) translate(${w.axl} ${w.ayl}) scale(${k.toFixed(3)} 1) translate(${-w.axl} ${-w.ayl})`));
  }
  _paintOpen(a){this.openAmt=a;this.open.setAttribute('opacity',a.toFixed(3));this.closed.setAttribute('opacity',(1-a).toFixed(3))}
  _place(dx=0,dy=0,dr=0){
    this.flight.setAttribute('transform',`translate(${dx.toFixed(2)} ${dy.toFixed(2)}) rotate(${dr.toFixed(2)})`);
  }
  /* ---- state machine ---- */
  setState(s,opts={}){
    this.state=s;this.p.animationState=s;this.opts=opts;
    this._stopLoop();
    if(Motion.reduced()){ /* butterflies simply rest */
      this.state='resting';this._paintOpen(0);this._place();this.rotNow=this.p.restRotation;this.p.rotation=this.rotNow;this.layout();
      if(opts.to){this.p.x=opts.to.x;this.p.y=opts.to.y;this.layout()}
      opts.onDone&&opts.onDone();return this;
    }
    switch(s){
      case 'resting':this.restTimer=3+this.rand()*5;this.peek=null;if(opts.instant){this._paintOpen(0)}else this._fadeOpen(0,420);this._startRest();break;
      case 'fluttering':case 'hovering':this._fadeOpen(1,320);this._loop(dt=>this._hover(dt,s==='hovering'));break;
      case 'flying':this._fly(opts,false);break;
      case 'landing':this._fly(opts,true);break;
      case 'celebrating':this._celebrate(opts);break;
    }
    return this;
  }
  _fadeOpen(to,ms){const from=this.openAmt;this._fo&&this._fo.cancel();this._fo=this.tween({from,to,duration:ms,ease:Motion.ease.soft,onUpdate:v=>this._paintOpen(v)})}
  _loop(fn,opts){this._stopLoop();this._sub=Motion.sub((t,dt)=>fn(dt,t),opts);this._subs.push(this._sub)}
  _stopLoop(){if(this._sub){Motion.unsub(this._sub);this._sub=null}}
  _startRest(){ /* slow, rare: open a little, close, pause */
    this._loop(dt=>{

    if(ms===.25){const it=this._first(it=>it.r.kind==='flower'&&it.g>.1&&it.g<.7);if(it)this.bloomCue(it.r.id)}
    else if(ms===.5){this.bloomCue('f1')}

  _first(fn){return this.bouquet.items.find(fn)}

  sparkleAt(x,y,delay=0){

    s.set({x,y,delay,sk:.34+Math.random()*.3});s.play();
  }
  /* ----- resting petals on the table ----- */
  _syncFloor(m,animate){
    while(this.floor.length<m.restingPetals){
      const F=LAYOUT.floorPetals[this.floor.length];
      const pt=new Petal({sprite:F.n,x:F.x,y:F.y,rotation:F.r,opacity:animate?0:.9}).mount(this.floorG);
      if(animate&&!Motion.reduced())pt.tween({from:0,to:.9,duration:1600,ease:Motion.ease.soft,onUpdate:v=>pt.set({opacity:v})});else pt.set({opacity:.9});
      this.floor.push(pt);
    }
    while(this.floor.length>m.restingPetals){this.floor.pop().destroy()}
  }
  skyPetal(){
    const R=LAYOUT.roam,names=['pet0','pet1','pet2','pet3','pet4','pet5'];
    const x=R.x0+Math.random()*(R.x1-R.x0),sz=1.05+Math.random()*.65;
    const pt=new Petal({sprite:names[Math.floor(Math.random()*names.length)],x,y:-120,size:sz,opacity:0,seed:(Math.random()*1e6)|0}).mount(this.petalG);
    this.sky.add(pt);
    pt.drift({from:{x,y:-120},to:{x:x+(Math.random()*160-80),y:360+Math.random()*110},duration:9500+Math.random()*5500,onDone:()=>{this.sky.delete(pt);pt.destroy()}});
  }
  dropPetal(){
    const cands=this.bouquet.items.filter(i=>i.r.kind==='flower'&&i.g>.8);if(!cands.length)return;
    const it=cands[Math.floor(Math.random()*cands.length)],sl=LAYOUT.slots[it.r.slot];
    const names=['pet0','pet1','pet2','pet4'];
    const pt=new Petal({sprite:names[Math.floor(Math.random()*names.length)],x:sl.x,y:sl.y,opacity:0,seed:(Math.random()*1e6)|0}).mount(this.petalG);
    this.drifters.add(pt);
    pt.drift({from:{x:sl.x,y:sl.y+8},to:{x:sl.x+(Math.random()*80-40),y:441},duration:4200+Math.random()*3800,onDone:()=>{this.drifters.delete(pt);pt.destroy()}});
  }
  /* ----- butterflies ----- */
  _perch(i){return[LAYOUT.perches.a,LAYOUT.perches.b,LAYOUT.perches.c,LAYOUT.perches.d][i]}
  _spawnRest(i,animate){
    const home=this._perch(i),v=['pink','purple','blue'][i],rr=[-6,8,-10,6][i];
    const b=new Butterfly({variant:v,x:home.x,y:home.y,rotation:rr,restRotation:rr,seed:i*41+9,opacity:1}).mount(this.bfG);
    b.home=home;this.rest[i]=b;
    if(!animate)this._wander(b,true);
    if(animate&&!Motion.reduced()){
      const start={x:i%2?440:-40,y:60+i*45};b.set({x:start.x,y:start.y,opacity:0});
      this._after(900+i*1300,()=>{if(this.rest[i]===b)b.setState('landing',{to:home,duration:7000,fadeIn:true,onDone:()=>this._wander(b,true)})});
      b.setState('hovering',{});
    }
  }
  /* butterflies never stop: land, breathe, drift to the next flower, repeat */
  _wander(b,first){
    if(!b||this.rest.indexOf(b)<0||Motion.reduced())return;
    this._after(first?400+Math.random()*2400:900+Math.random()*1800,()=>{
      if(this.rest.indexOf(b)<0||!b.el.isConnected)return;
      const P=LAYOUT.perches,all=Object.values(P),taken=this.rest.filter(x=>x&&x!==b).map(x=>x.home);
      const free=all.filter(q=>!taken.includes(q)&&q!==b.home);
      if(b.home===null)b.home=all[0];
      const to=free[Math.floor(Math.random()*free.length)]||all[0];
      const R=LAYOUT.roam,far=()=>{let q,n=0;do{q={x:R.x0+Math.random()*(R.x1-R.x0),y:R.y0+Math.random()*(R.y1-R.y0)};n++}while(Math.hypot(q.x-b.p.x,q.y-b.p.y)<120&&n<8);return q};
      if(Math.random()<.55){ /* drift out across the screen and hover there for a moment */
        b.home=null;b.setState('flying',{to:far(),duration:5200+Math.random()*3600,onDone:()=>this._wander(b)});
      }else{
        b.home=to;
        const go=()=>b.setState('landing',{to,duration:4600+Math.random()*3400,onDone:()=>this._wander(b)});
        if(Math.random()<.4){b.setState('hovering',{});this._after(1200+Math.random()*1200,()=>{if(this.rest.indexOf(b)>=0)go()})}else go();
      }
    });
  }
  _syncButterflies(m,animate){
    for(let i=0;i<m.restingButterflies;i++)if(!this.rest[i])this._spawnRest(i,animate);
    for(let i=this.rest.length-1;i>=m.restingButterflies;i--){
      const b=this.rest[i];if(!b)continue;this.rest.length=i;
      if(Motion.reduced()||!animate){b.destroy();continue}

    }
  }
  /* a visitor passes through and leaves */
  visit(){

    const left=Math.random()<.5,sx=left?-60:460,sy=-20+Math.random()*300;
    const b=new Butterfly({variant:c,x:sx,y:sy,opacity:0,seed:(Math.random()*1e6)|0}).mount(this.bfG);
    this.temps.add(b);
    const R=LAYOUT.roam,near={x:R.x0+60+Math.random()*(R.x1-R.x0-120),y:R.y0+20+Math.random()*(R.y1-R.y0-120)};
    const out={x:left?460:-60,y:near.y-70};
    b.setState('flying',{to:near,duration:5200,fadeIn:true,onDone:()=>{
      b.setState('hovering',{});
      this._after(2600,()=>{ if(!b.el.isConnected)return; b.setState('flying',{to:out,duration:6200,fadeOut:true,final:true,onDone:()=>{this.temps.delete(b);b.destroy()}})});
    }});
  }
  /* completion: one graceful flight around the bouquet, no confetti */
  celebrate(){
    if(Motion.reduced())return;
    const home=this._perch(0);let b=this.rest[0],temp=false;
    if(!b||b.state!=='resting'){b=new Butterfly({variant:'cream',x:home.x,y:home.y,opacity:0}).mount(this.bfG);temp=true;this.temps.add(b)}
    b.setState('celebrating',{center:{x:200,y:210},radius:118,land:temp?null:home,onDone:()=>{if(temp){this.temps.delete(b);b.destroy()}}});
    [2400,3200,4000,4800].forEach((t,i)=>this._after(t,()=>this.sparkleAt(150+i*34,100+(i%2)*40,0)));
  }
  destroy(){
    Motion.unsub(this.idleSub);this.stopWatch&&this.stopWatch();
    this._timers.forEach(t=>t.cancel());
    this.sparks.forEach(s=>s.destroy());this.floor.forEach(p=>p.destroy());this.drifters.forEach(p=>p.destroy());this.sky.forEach(p=>p.destroy());
    this.rest.forEach(b=>b&&b.destroy());this.temps.forEach(b=>b.destroy());
    this.bouquet.destroy();this.water.destroy();this.vase.destroy();this.svg.remove();
  }
}

/* ---------- <BotanicalProgress progress goal current /> ---------- */
class BotanicalProgress{
  constructor(container,{progress,goal,current,from=null,sky=true}={}){
    this.goal=goal;this.current=current;
    const p=progress!=null?progress:(goal>0?current/goal:0);
    this.scene=new BotanicalScene(container,{progress:Motion.clamp(p),from,sky});
    this.progress=Motion.clamp(p);
  }
  update({progress,goal,current,animate=true,duration}={}){
    if(goal!=null)this.goal=goal;if(current!=null)this.current=current;
    const p=progress!=null?progress:(this.goal>0?this.current/this.goal:0);
    this.progress=Motion.clamp(p);this.scene.setProgress(this.progress,{animate,duration});
  }
  destroy(){this.scene.destroy()}
}

/* ---------- <ExpenseFlower amount maxAmount /> : the same bouquet as the tracker, grown by how big the amount is ---------- */
class ExpenseFlower{
  constructor(container,{amount=0,maxAmount=50}={}){
    injectSpriteDefs();
    this.max=Math.max(1,maxAmount);
    this.svg=svgEl('svg',{viewBox:'56 70 288 384',preserveAspectRatio:'xMidYMax meet',role:'img','aria-label':'A bouquet that grows with the amount'},container);
    this.vase=new Vase();this.water=new Water();this.bouquet=new Bouquet();
    this.svg.appendChild(this.vase.back);this.water.mount(this.svg);this.bouquet.mount(this.svg);
    this.svg.appendChild(this.water.front);this.svg.appendChild(this.vase.front);
    this.spark=new Sparkle({sprite:'spk0',x:212,y:130}).mount(this.svg);
    this.cur=this._q(amount);this.target=this.cur;this._apply(this.cur);
    this.idleSub=Motion.sub((t)=>{this.bouquet.idle(t);this.water.idle(t)},{fps:30});
    this.stopWatch=Motion.watch(this.svg,this.idleSub);
    this.sm=null;
  }
  /* a gentle curve so small amounts still show something, and the biggest amount is a full bouquet */
  _q(a){return Math.pow(Motion.clamp(a/this.max),.55)}
  _apply(q){
    PROGRESS.map(q).elements.forEach(e=>{const it=this.bouquet.by[e.id];if(!it)return;it.g=e.growth;it.target=e.growth;it.comp.apply(e.growth)});
    this.water.setLevel(LAYOUT.vase.waterMin+(LAYOUT.vase.waterMax-LAYOUT.vase.waterMin)*q);
  }
  /* the bouquet follows the bar with a soft, damped glide: no jumps, no bounce */
  setAmount(a){
    this.target=this._q(a);
    if(Motion.reduced()){this.cur=this.target;try{this._apply(this.cur)}catch(e){console.error(e)}return}
    if(this.sm)return;
    this.sm=Motion.sub((t,dt)=>{
      try{
        this.cur+=(this.target-this.cur)*(1-Math.exp(-dt/.16));
        if(Math.abs(this.target-this.cur)<.002){this.cur=this.target;Motion.unsub(this.sm);this.sm=null}
        this._apply(this.cur);
      }catch(e){Motion.unsub(this.sm);this.sm=null;console.error(e)}      /* never leave the bouquet stuck */
    });
  }
  nudge(){
    this.bouquet.items.forEach(it=>{if(it.g>.25&&it.comp.nudge)it.comp.nudge(2.4,800)});
    this.water.ripple();
  }
  sparkle(){this.spark.play()}
  destroy(){
    Motion.unsub(this.idleSub);Motion.unsub(this.sm);this.stopWatch&&this.stopWatch();
    this.spark.destroy();this.bouquet.destroy();this.water.destroy();this.vase.destroy();this.svg.remove();
  }
}

/* ---------- GardenScene: a little garden across the bottom of the goals screen ---------- */
const GARDEN={
  /* three rows deep: far foliage and small flowers, a middle row of full blooms, and a front row of buds and sprigs */
  back:[['fill1',20,.95],['fill4',72,1.0],['fill7',130,.9],['fill4',196,1.05],['fill7',258,.92],['fill1',322,.98],['fill4',380,1.0]],      /* base 196 */
  far:[['cream','full',46,.5,8],['pink','full',160,.5,22],['lav','full',232,.5,0],['butter','full',300,.48,14],['pink','full',362,.5,26]],   /* base 208 (+ lift) */
  mid:[['pink','full',34,.74,0],['lav','full',96,.7,34],['cream','full',156,.82,0],['butter','full',220,.72,46],['pink','full',284,.84,12],['cream','full',344,.72,38],['lav','full',392,.7,0]], /* base 258 (+ lift) */
  sprigs:[['fill0',62,.7],['fill2',126,.7],['fill3',190,.7],['fill5',252,.7],['fill6',316,.7],['fill0',372,.7]],                          /* base 272 */
  front:[['pink','bud2',10,.75],['cream','partial',70,.72],['lav','bud1',138,.85],['pink','partial',200,.74],['butter','bud2',264,.74],['cream','bud1',326,.85],['lav','partial',380,.72]] /* base 284 */
};
class GardenScene{
  constructor(plantsBox,fxBox){
    injectSpriteDefs();
    this.W=400;this.H=300;
    this.svg=svgEl('svg',{viewBox:`0 0 ${this.W} ${this.H}`,preserveAspectRatio:'xMidYMax meet','aria-hidden':'true'},plantsBox);
    this.fx=svgEl('svg',{viewBox:`0 0 ${this.W} ${this.H}`,preserveAspectRatio:'xMidYMax meet','aria-hidden':'true'},fxBox);
    /* everything sits 40 units lower than drawn: whole blooms show, and the stems fall off the bottom of the screen */
    this.gp=svgEl('g',{transform:'translate(0 40)'},this.svg);
    this.plants=[];this.heads=[];
    const rng=Motion.rng(11);
    const add=(name,x,base,s,lift=0)=>{
      const m=ART.S[name],g=svgEl('g',null,this.gp);
      if(lift>0)svgEl('line',{x1:0,y1:0,x2:0,y2:(lift+120)/s,stroke:'#667349','stroke-width':3.4,'stroke-linecap':'round'},g);   /* a longer stem running off the bottom */
      svgEl('use',{href:'#s-'+name,x:-m.ax,y:-m.ay},g);
      const p={g,x,base:base-lift,s,period:3600+rng()*4200,phase:rng()*6.28,amp:.9+rng()*1.1};
      this.plants.push(p);this._paint(p,0);return{m,p};
    };
    const head=(m,x,base,sc)=>({x:x+(m.hx-m.ax)*sc,y:base+40+(m.hy-m.ay)*sc});
    GARDEN.back.forEach(([n,x,sc])=>add(n,x,196,sc));
    GARDEN.far.forEach(([v,st,x,sc,l])=>{const{m}=add(`fl_${v}_${st}`,x,208,sc,l);this.heads.push(head(m,x,208-l,sc))});
    GARDEN.mid.forEach(([v,st,x,sc,l])=>{const{m}=add(`fl_${v}_${st}`,x,258,sc,l);this.heads.push(head(m,x,258-l,sc))});
    GARDEN.sprigs.forEach(([n,x,sc])=>add(n,x,272,sc));
    GARDEN.front.forEach(([v,st,x,sc])=>add(`fl_${v}_${st}`,x,284,sc));
    /* things that float over everything */
    this.sparks=Array.from({length:24},(_,i)=>new Sparkle({sprite:'spk'+(i%3),seed:i+5}).mount(this.fx));
    this.bfs=[];this.petals=new Set();this._timers=new Set();this.sparkCountdown=1.2;this.petalCountdown=1;this._sk=0;
    const u=this.W/Math.max(1,plantsBox.clientWidth||innerWidth),boxH=plantsBox.clientHeight||260;
    this.roam={x0:-10,x1:410,y0:-(Math.max(300,innerHeight)-boxH)*u+30,y1:270};
    this.idleSub=Motion.sub((t,dt)=>this._idle(t,dt),{fps:30});this.stopWatch=Motion.watch(this.svg,this.idleSub);
    /* they start up in the air with open wings, and set off straight away */
    const starts=[{x:70,y:120},{x:330,y:80},{x:200,y:150}];
    this.landedN=0;this.trailT=0;
    ['pink','purple','blue'].forEach((v,i)=>{
      const b=new Butterfly({variant:v,state:'hovering',x:starts[i].x,y:starts[i].y,rotation:i%2?8:-8,restRotation:i%2?8:-8,seed:i*29+3}).mount(this.fx);
      this.bfs.push(b);
      if(!Motion.reduced())this._after(80+i*260,()=>this._wander(b,true));
    });
  }
  _paint(p,t){
    const a=Motion.reduced()?0:Math.sin(t/p.period*6.2832+p.phase)*p.amp;
    p.g.setAttribute('transform',`translate(${p.x} ${p.base}) rotate(${a.toFixed(2)}) scale(${p.s})`);
  }
  _after(ms,fn){const t=Motion.after(ms,()=>{this._timers.delete(t);fn()});this._timers.add(t);return t}
  _idle(t,dt){
    if(Motion.reduced())return;
    for(const p of this.plants)this._paint(p,t);
    this.sparkCountdown-=dt;
    if(this.sparkCountdown<=0){
      this.sparkCountdown=.1+Math.random()*.18;
      const R=this.roam,s=this.sparks[(this._sk=(this._sk+1)%this.sparks.length)];
      const nearFlower=Math.random()<.55,h=this.heads[Math.floor(Math.random()*this.heads.length)];
      s.set({x:nearFlower?h.x+(Math.random()*50-25):R.x0+Math.random()*(R.x1-R.x0),y:nearFlower?h.y+(Math.random()*40-30):R.y0+Math.random()*(R.y1-R.y0),sk:.36+Math.random()*.36});s.play();
    }
    this.trailT-=dt;
    if(this.trailT<=0){
      this.trailT=.28;
      for(const b of this.bfs){
        if(['flying','landing','hovering'].includes(b.state)&&Math.random()<.75){
          const s=this.sparks[(this._sk=(this._sk+1)%this.sparks.length)];
          s.set({x:b.p.x-10+Math.random()*20,y:b.p.y+6+Math.random()*16,sk:.3+Math.random()*.25});s.play();
        }
      }
    }
    this.petalCountdown-=dt;
    if(this.petalCountdown<=0&&this.petals.size<6){this.petalCountdown=1.6+Math.random()*2;this._petal()}
  }
  _petal(){
    const R=this.roam,names=['pet0','pet1','pet2','pet3','pet4','pet5'],x=R.x0+Math.random()*(R.x1-R.x0);
    const p=new Petal({sprite:names[Math.floor(Math.random()*names.length)],x,y:R.y0-20,size:1.05+Math.random()*.65,opacity:0,seed:(Math.random()*1e6)|0}).mount(this.fx);
    this.petals.add(p);
    p.drift({from:{x,y:R.y0-20},to:{x:x+(Math.random()*160-80),y:262+Math.random()*30},duration:11000+Math.random()*6000,onDone:()=>{this.petals.delete(p);p.destroy()}});
  }
  /* butterflies drift across the whole screen, now and then landing on a flower */
  _wander(b,first){
    if(Motion.reduced()||!b.el.isConnected)return;
    this._after(first?30:400+Math.random()*1400,()=>{
      if(!b.el.isConnected)return;
      const R=this.roam;
      if(this.landedN<1&&Math.random()<.28){
        this.landedN++;
        const h=this.heads[Math.floor(Math.random()*this.heads.length)];
        b.setState('landing',{to:{x:h.x+6,y:h.y-8},duration:5200+Math.random()*3000,onDone:()=>this._after(900+Math.random()*1300,()=>{this.landedN--;this._wander(b)})});
      }else{
        let q,n=0;do{q={x:R.x0+Math.random()*(R.x1-R.x0),y:R.y0+Math.random()*(R.y1-R.y0)};n++}while(Math.hypot(q.x-b.p.x,q.y-b.p.y)<110&&n<8);
        b.setState('flying',{to:q,duration:4800+Math.random()*3600,onDone:()=>this._wander(b)});
      }
    });
  }
  destroy(){
    Motion.unsub(this.idleSub);this.stopWatch&&this.stopWatch();this._timers.forEach(t=>t.cancel());
    this.sparks.forEach(s=>s.destroy());this.bfs.forEach(b=>b.destroy());this.petals.forEach(p=>p.destroy());
    this.svg.remove();this.fx.remove();
  }
}


/* ---------- PetalRain: petals falling all the way down the screen, without end ---------- */
class PetalRain{
  constructor(host,{max=14}={}){
    this.live=new Set();this.max=max;this.gap=.3;this.sub=null;this.dead=false;
    if(Motion.reduced())return;                        /* reduced motion: petals do not fall */
    injectSpriteDefs();
    const r=host.getBoundingClientRect();this.W=r.width||innerWidth;this.H=r.height||innerHeight;
    this.svg=svgEl('svg',{viewBox:`0 0 ${this.W} ${this.H}`,'aria-hidden':'true'},host);
    this.svg.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible';
    for(let i=0;i<9;i++)this._spawn(true);               /* a few already on their way, so it never starts empty */
    this.sub=Motion.sub((t,dt)=>this._tick(dt));
  }
  _spawn(prefill){
    const names=['pet0','pet1','pet2','pet3','pet4','pet5'],R=Math.random;
    const dur=9+R()*7,x0=R()*this.W,pet=new Petal({sprite:names[Math.floor(R()*6)],size:1.1+R()*.8,opacity:0,seed:(R()*1e6)|0}).mount(this.svg);
    this.live.add({pet,age:prefill?R()*dur*.85:0,dur,x0,drift:(R()*2-1)*90,amp:10+R()*26,freq:.8+R()*1.4,ph:R()*6.28,r0:R()*360,spin:(R()<.5?-1:1)*(40+R()*90)});
  }
  _tick(dt){
    if(this.dead)return;
    this.gap-=dt;
    if(this.gap<=0&&this.live.size<this.max){this.gap=.35+Math.random()*.55;this._spawn(false)}
    for(const p of [...this.live]){
      p.age+=dt;const k=p.age/p.dur;
      if(k>=1){p.pet.destroy();this.live.delete(p);continue}
      const op=Math.min(1,p.age/.5)*(k>.9?(1-k)/.1:1);
      p.pet.p.x=p.x0+p.drift*k+Math.sin(p.age*p.freq+p.ph)*p.amp;
      p.pet.p.y=-40+(this.H+90)*k;
      p.pet.p.rotation=p.r0+p.spin*p.age;p.pet.p.opacity=op;p.pet.layout();
    }
  }
  destroy(){this.dead=true;Motion.unsub(this.sub);this.live.forEach(p=>p.pet.destroy());this.live.clear();this.svg&&this.svg.remove()}
}

/* =====================================================================
   CONFETTI — a small burst of petals, leaves and sparkles for every save.
   Drawn from the same artwork as everything else, floaty rather than fast.
   ===================================================================== */
const Confetti=(()=>{
  let svg=null;const live=new Set();let sub=null;
  /* what falls: [sprite, scale range, weight] */
  const KINDS=[
    ['pet0',[.34,.52],3],['pet1',[.34,.52],3],['pet2',[.34,.52],3],['pet3',[.34,.52],2],['pet4',[.34,.52],2],['pet5',[.34,.52],2],
    ['spk0',[.6,1],2],['spk1',[.6,1],2],['spk2',[.6,1],2],
    ['fill8',[.22,.32],1],['fill4',[.19,.28],1],['fill1',[.19,.28],1],
    ['accent0',[.26,.36],1]
  ];
  const TOTAL=KINDS.reduce((t,k)=>t+k[2],0);
  const pick=()=>{let r=Math.random()*TOTAL;for(const k of KINDS){if((r-=k[2])<0)return k}return KINDS[0]};
  const rand=(a,b)=>a+Math.random()*(b-a);

  function ensure(){
    if(svg&&svg.isConnected)return;
    svg=svgEl('svg',{width:'100%',height:'100%','aria-hidden':'true'});
    svg.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:70;overflow:visible';
    document.body.appendChild(svg);
  }
  function step(t,dt){
    for(const p of [...live]){
      p.age+=dt;const k=p.age/p.life;
      if(k>=1){p.el.remove();live.delete(p);continue}
      /* floaty physics: thrown up, then air resistance lets it drift down slowly */
      p.vy+=(p.g-p.drag*p.vy)*dt;p.vx+=(-p.drag*p.vx)*dt;
      p.x+=p.vx*dt+Math.sin(p.age*p.swayF+p.ph)*p.swayA*dt;p.y+=p.vy*dt;
      p.rot+=p.spin*dt;
      const flip=p.flat?1:Math.cos(p.age*p.flipF+p.ph);                 /* petals turn over as they fall */
      let s=p.s;
      if(p.twinkle)s*=.75+.35*Math.sin(p.age*9+p.ph);
      const op=Math.min(1,p.age/.08)*(k<.62?1:1-(k-.62)/.38);
      p.el.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(1)}) scale(${(s*flip).toFixed(3)} ${s.toFixed(3)})`);
      p.el.setAttribute('opacity',op.toFixed(3));
    }
    if(!live.size&&sub){Motion.unsub(sub);sub=null}
  }
  /* x,y = where it bursts from (screen pixels) */
  function burst(x,y,{count=44,power=1}={}){
    if(Motion.reduced())return;
    ensure();
    count=Math.min(count,Math.max(0,110-live.size));
    for(let i=0;i<count;i++){
      const [name,sr]=pick(),m=ART.S[name];
      if(!m)continue;
      const el=svgEl('g',{opacity:0},svg);
      const u=svgEl('use',{href:'#s-'+name,x:-m.w/2,y:-m.h/2},el);
      const ang=rand(-165,-15)*Math.PI/180,sp=rand(340,840)*power;
      const spark=name.startsWith('spk');
      live.add({el,x:x+rand(-14,14),y:y+rand(-8,8),vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
        g:rand(420,560),drag:rand(1.8,2.6),swayF:rand(2.2,4),swayA:rand(25,70),ph:rand(0,6.28),
        rot:rand(0,360),spin:(Math.random()<.5?-1:1)*rand(60,220),flipF:rand(3,6),flat:spark||name.startsWith('fill')||name==='accent0',
        s:rand(sr[0],sr[1]),twinkle:spark,age:0,life:rand(2.2,3.4)});
    }
    if(!sub)sub=Motion.sub(step);
  }
  const fromElement=(el,o)=>{const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,o)};
  return{burst,fromElement,get active(){return live.size}};
})();

const Store={
  async get(k){
    try{if(window.storage){const r=await window.storage.get(k,false);if(r&&r.value)return r.value}}catch(e){}
    try{return localStorage.getItem(k)}catch(e){return null}
  },
  async set(k,v){
    let ok=false;
    try{if(window.storage){await window.storage.set(k,v,false);ok=true}}catch(e){}

    return ok;
  }
};

/* ---------- mount the botanical visuals that belong to each screen ---------- */
let rulerTw=null,fitRO=null,homeUI=null;
function disposeViz(){homeUI=null;rulerTw&&rulerTw.cancel();rulerTw=null;fitRO&&fitRO.disconnect();fitRO=null;if(viz){[].concat(viz).forEach(v=>v&&v.destroy&&v.destroy());viz=null}}
function mountViz(){
  if(view==='bloomed'){

    const holder=document.createElement('div');holder.style.cssText='position:relative;margin:0 auto';hero.appendChild(holder);
    const f2=()=>{const W=hero.clientWidth,H=hero.clientHeight,s=Math.min(W,H*340/406);holder.style.width=s+'px';holder.style.height=(s*406/340)+'px'};

    const w=state.wish,p=w?pctNow()/100:0;

      if(ruler){ruler.style.top=(sc.offsetTop+.11*sc.offsetHeight)+'px';ruler.style.height=(.855*sc.offsetHeight)+'px'}};
    fit();fitRO=new ResizeObserver(fit);fitRO.observe(gw);
    viz=new BotanicalProgress(sc,{progress:p,goal:w?w.price:undefined,current:w?wishSaved():undefined,from:shown});
    if(w){
      /* the ruler: goal split in thirds, like the reference; the pill rises with the water */
      const tick=k=>`<div class="rtick" data-f="${(3-k)/3}" style="top:${k*100/3}%"><span class="rl">${money(Math.round(w.price*(3-k)/3))}</span></div>`;
